{
    "topics": {
        "cmd_vel": "/cmd_vel",
        "cam_return": "/cam_return",
        "board2_return": "/board2_return",
        "nav_state": "/nav_state",
        "round_done": "/dual_car/round_done",
        "peer_done": "/dual_car/peer_done",
        "clear_costmaps_service": "/move_base/clear_costmaps",
        "move_base_action": "move_base",
    },

    "states": {
        "WAIT_TURN": 8,
        "GO_TO_BOARD1": 9,
        "BOARD1_RECOGNIZING": 10,
        "GO_TO_PICKUP_WINDOWS": 11,
        "GO_TO_BOARD2": 12,
        "BOARD2_RECOGNIZING": 13,
        "GO_TO_LAB_WINDOW": 14,
        "GO_BACK_HOME": 15,
    },

    "nav": {
        "startup": {
            "ready_timeout_sec": 60.0,
            "poll_rate_hz": 10.0,
            "image_max_age_sec": 1.0,
            "vision_node": "/detect_abc",
        },
        "state_machine_rate_hz": 5,
        "wait_result_rate_hz": 10,
        "move_timeout_sec": 90,
        # 0 表示沿用旧逻辑：一直等待。建议调试期设 20~60，避免识别节点异常时状态机永久卡死。
        "board1_wait_timeout_sec": 30,
        "board1_recovery": {
            "enabled": true,
            "force_reverse": true, # 仅板一保底跳过后方激光检查，其他导航不受影响。
            "recognition_wait_sec": 3.0,
            "reverse_distance_m": 0.30,
            "reverse_speed_mps": 0.15,
            "reverse_min_speed_mps": 0.04,
            "braking_acceleration": 0.3,
            "distance_tolerance_m": 0.005,
            "reverse_timeout_sec": 5.0,
            "control_rate_hz": 20.0,
            "stop_hold_sec": 0.3,
            "maximum_overshoot_m": 0.03,
            "maximum_lateral_drift_m": 0.03,
            "maximum_forward_drift_m": 0.02,
            "maximum_heading_drift_deg": 5.0,
            "odom_frame": "odom",
            "base_frame": "base_footprint",
            "tf_max_age_sec": 0.3,
            "scan_topic": "/scan",
            "scan_ready_timeout_sec": 1.0,
            "scan_max_age_sec": 0.35,
            "footprint_param": "/move_base/TebLocalPlannerROS/footprint_model/vertices",
            "rear_margin_m": 0.03,
            "rear_visible_fraction": 0.60,
        },
        "board2_wait_timeout_sec": 5, # 到最终板二停车点后超时未识别，按空闲播报并继续。
        "move_base_wait_server_sec": 60,
        "pickup_task_hold_sec": 0.5,
        "lab_task_hold_sec": 0.5,
        "post_clear_costmap_sleep_sec": 0.5,
        "home_arrive_sleep_sec": 0.1,
        "dual_publish_repeat": 1,
        "dual_publish_interval_sec": 0.10,
        # 原点连续经过时不额外限速，交接前恢复实际容差；需等待/结束时仍停车。
        "home_arrival": {
            "planner_namespace": "/move_base/TebLocalPlannerROS",
            "config_timeout_sec": 3.0,
            "pass_through": true,
            "switch_distance_m": 0.35,
            "switch_yaw_tolerance_deg": 45.0,
            "poll_rate_hz": 20.0,
            "free_goal_vel": true,
            "xy_goal_tolerance": 0.25,
            "yaw_goal_tolerance_deg": 30.0,
            "odom_topic": "/odometry/filtered",
            "stop_hold_sec": 0.3,
            "stop_timeout_sec": 5.0,
            "stop_linear_speed": 0.02,
            "stop_angular_speed": 0.05,
            "odom_max_age_sec": 0.5,
        },
        # 板二进场先到上方通道，面向西侧，再到原板二停车点。
        # via_points 使用米和角度，不使用下方 waypoints 的朝向索引。
        "board2_approach": {
            "enabled": true,
            "planner_namespace": "/move_base/TebLocalPlannerROS",
            "config_timeout_sec": 3.0,
            "via_points": [
                {"x": 0.200, "y": 3.700, "yaw_deg": 180.0},
            ],
            # 不额外限速；提前交接目标，避免把过渡点当成精确停车点。
            "switch_distance_m": 0.35,
            "switch_yaw_tolerance_deg": 45.0,
            "poll_rate_hz": 20.0,
            # 过渡点允许非零终速；若先收到到达结果，也用宽容差减少微调。
            "xy_goal_tolerance": 0.20,
            "yaw_goal_tolerance_deg": 30.0,
            "free_goal_vel": true,
        },
        "euler_angles": [
            1.5707963267948966, 1.5707963267948966, 1.5707963267948966,
            -1.5707963267948966, -1.5707963267948966, -1.5707963267948966, -1.5707963267948966,
            0.0, -3.141592653589793, 0.0,
        ],
        # waypoint 顺序必须保持旧代码约定：0=C,1=A,2=B,3=4号,4=3号,5=2号,6=1号,7=起点,8=板2,9=板1
        "waypoints": {
            "C": [1.400, 1.900, 0],
            "A": [0.700, 2.400, 1],
            "B": [1.450, 2.900, 2],
            "lab4": [-1.700, 0.900, 3],
            "lab3": [-2.400, 1.400, 4],
            "lab2": [-1.600, 1.700, 5],
            "lab1": [-2.400, 2.400, 6],
            "board2": [-1.700, 3.700, 8],
            "board1": [0.550, 0.000, 9],
        },
    },

    "dual_tcp": {
        "local_host": "0.0.0.0",
        "socket_timeout_sec": 2.0,
        "retry_interval_sec": 0.20,
        "send_duration_sec": 3.0,
        "peer_done_publish_repeat": 3,
        "peer_done_publish_interval_sec": 0.05,
        "server_accept_timeout_sec": 1.0,
        "client_recv_timeout_sec": 2.0,
        "max_line_chars": 2048,
        # null 表示不校验口令；如现场网络不可信，可设置同一个字符串，例如 "race-secret"。
        "shared_token": null, # 作用是在双方都设置了相同字符串时，TCP 消息里会携带这个口令，接收方验证不通过就丢弃消息；调试时可改 null 以简化流程，但正式比赛建议设置以防误连。
        # true 时只接受 PEER_IP 发来的 done。若现场 IP 会漂移，可临时改 false。
        "check_peer_ip": true,
    },

    "lab_info": {
        3: {"real_window": 4, "sample_name": "血浆", "pickup_audio_prefix": "xuejiang", "delivery_audio_prefix": "jisu", "lab_name": "激素检验窗口"},
        2: {"real_window": 3, "sample_name": "组织", "pickup_audio_prefix": "zuzhi", "delivery_audio_prefix": "mianyi", "lab_name": "免疫检验窗口"},
        1: {"real_window": 2, "sample_name": "唾液", "pickup_audio_prefix": "tuoye", "delivery_audio_prefix": "tiye", "lab_name": "体液检验窗口"},
        0: {"real_window": 1, "sample_name": "静脉血", "pickup_audio_prefix": "jingmaixue", "delivery_audio_prefix": "xuechanggui", "lab_name": "血常规检验窗口"},
    },

    "window_log_name": {
        "A": "a", "B": "b", "C": "c", "AB": "a、b", "AC": "a、c", "BC": "b、c", "ABC": "a、b、c",
    },
}
