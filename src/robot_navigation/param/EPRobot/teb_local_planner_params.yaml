TebLocalPlannerROS:

  # ============================================================
  # Odometry
  # ============================================================

  # 使用 EKF 融合后的里程计
  # 如果你的系统有 /slave 命名空间，可改成 odometry/filtered
  odom_topic: /odometry/filtered


  # ============================================================
  # Trajectory
  # ============================================================

  teb_autosize: true

  # 兼顾轨迹精细度和低算力
  dt_ref: 0.25
  dt_hysteresis: 0.08

  min_samples: 5
  max_samples: 80

  # 精确停靠任务中不建议初始倒车
  allow_init_with_backwards_motion: false

  # 新目标距离超过该值时重新初始化轨迹
  force_reinit_new_goal_dist: 0.5

  # 让局部路径使用全局路径方向
  global_plan_overwrite_orientation: true

  # local_costmap 为 3m × 3m，前瞻距离 1.5m 比较合适
  max_global_plan_lookahead_dist: 1.5
  global_plan_prune_distance: 0.4

  # 让 TEB 适当跟随全局路径，避免切内道
  global_plan_viapoint_sep: 0.30
  via_points_ordered: false

  feasibility_check_no_poses: 5
  exact_arc_length: false

  publish_feedback: false


  # ============================================================
  # Robot Velocity
  # ============================================================

  # 参考第一版速度，提高比赛效率
  max_vel_x: 1.2

  # 不建议使用第一版的 0.8，倒车太快会影响精确停靠
  max_vel_x_backwards: 0.25

  # 非全向/阿克曼小车
  max_vel_y: 0.0

  # 参考第一版
  max_vel_theta: 1.5

  # 参考第一版，较小加速度有利于平顺和精确停靠
  acc_lim_x: 0.15
  acc_lim_y: 0.0
  acc_lim_theta: 0.42


  # ============================================================
  # Carlike Robot Parameters
  # ============================================================

  # 根据你前两版参数，0.43~0.45 都合理
  # 如果实测小车转不过窄通道转角，可尝试降到 0.40
  min_turning_radius: 0.45

  # 注意：这里最好和 art_racecar.py / 底盘 launch 里的 wheelbase 一致
  # 如果你在 launch 中实际传了 0.21，就把这里改成 0.21
  wheelbase: 0.21

  # art_racecar.py 默认接收 cmd_vel.angular.z，再转换为转向角
  # 所以这里必须保持 false
  cmd_angle_instead_rotvel: false


  # ============================================================
  # Footprint
  # ============================================================

  is_footprint_dynamic: false

  footprint_model:
    type: "polygon"
    vertices: [[-0.14, -0.11], [0.14, -0.11], [0.14, 0.11], [-0.14, 0.11]]


  # ============================================================
  # Goal Tolerance
  # ============================================================

  # 精确停进 500mm × 500mm 区域，建议 5cm
  # 如果实车低速性能不好，可临时放宽到 0.06~0.08
  xy_goal_tolerance: 0.07

  # 约 4.6°
  yaw_goal_tolerance: 0.15

  # 到目标点必须停稳
  free_goal_vel: false


  # ============================================================
  # Obstacles
  # ============================================================

  # 车宽约 0.22m，500mm 通道居中时左右余量约 0.14m
  # 0.15 太保守，0.05 偏贴边，0.07 更适合
  min_obstacle_dist: 0.07

  # 必须大于 min_obstacle_dist，用软约束引导远离障碍
  inflation_dist: 0.18

  include_costmap_obstacles: true

  # 没有明确动态障碍预测模型时建议关闭
  include_dynamic_obstacles: false

  # 后方障碍物考虑距离，不需要太大
  costmap_obstacles_behind_robot_dist: 0.6

  dynamic_obstacle_inflation_dist: 0.15

  obstacle_poses_affected: 10

  costmap_converter_plugin: ""
  costmap_converter_spin_thread: false
  costmap_converter_rate: 5

  legacy_obstacle_association: false
  obstacle_association_cutoff_factor: 5.0
  obstacle_association_force_inclusion_factor: 1.5


  # ============================================================
  # Optimization
  # ============================================================

  no_inner_iterations: 5
  no_outer_iterations: 4

  optimization_activate: true
  optimization_verbose: false

  penalty_epsilon: 0.05

  weight_max_vel_x: 2
  weight_max_vel_theta: 1

  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1

  # 非完整约束，车式/阿克曼底盘必须较高
  weight_kinematics_nh: 1000

  # 鼓励前进，但不完全禁止必要的小幅倒车
  weight_kinematics_forward_drive: 800

  # 加强最小转弯半径约束，避免规划出实际转不过去的轨迹
  weight_kinematics_turning_radius: 20.0

  # 保留一定速度优势，但不要像第一版 30 那么激进
  weight_optimaltime: 12

  # 障碍物权重略高，适合窄通道和任务区
  weight_obstacle: 70

  weight_dynamic_obstacle: 100
  obstacle_cost_exponent: 4.0

  weight_adapt_factor: 1.2

  weight_dynamic_obstacle_inflation: 0.6
  weight_inflation: 0.8

  # 不要太高，否则会过度追求最短路径、容易贴边
  weight_shortest_path: 1.0

  # 配合 global_plan_viapoint_sep: 0.30，让局部路径更跟随全局居中路径
  weight_viapoint: 12.0


  # ============================================================
  # Homotopy Class Planner
  # ============================================================

  # 小型固定竞赛场地，不建议开启同伦多路径，省算力且更稳定
  enable_homotopy_class_planning: false
  enable_multithreading: false

  simple_exploration: false
  max_number_classes: 2

  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 1.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false

  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  roadmap_graph_area_length_scale: 1.0

  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_keypoint_offset: 0.1
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: false


  # ============================================================
  # Recovery
  # ============================================================

  shrink_horizon_backup: true
  shrink_horizon_min_duration: 5

  oscillation_recovery: true
  oscillation_recovery_min_duration: 5
  oscillation_filter_duration: 5
