global_costmap:
  # 全局坐标系
  global_frame: map

  # 机器人基坐标系
  robot_base_frame: base_footprint

  # 全局地图更新频率
  # 2Hz合并静态地图与激光临时障碍，供1Hz全局重规划使用。
  update_frequency: 2.0

  # 发布频率主要用于 RViz 显示
  publish_frequency: 1.0

  # 全局地图不使用滚动窗口
  rolling_window: false

  # 与 map.yaml 中 resolution 保持一致
  resolution: 0.05

  # 低算力平台给 TF 一定容忍时间
  transform_tolerance: 0.5

  # 顺序必须为静态层 -> 实时障碍层 -> 膨胀层。
  # 障碍层沿用costmap_common_params.yaml的激光标记/清除及3.0m/3.5m范围；
  # move_base.launch把scan重映射到scan_filtered。静态定位地图不被修改。
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  static_layer:
    enabled: true
    map_topic: "/map"

  inflation_layer:
    enabled: true

    # 原有0.30m膨胀影响范围同时作用于墙体和新检测的临时障碍。
    # 膨胀代价随距离衰减，0.30m不是全部设置为不可通行。
    inflation_radius: 0.3

    # 比 10 略柔和，让全局路径更愿意走通道中间
    cost_scaling_factor: 8
