local_costmap:
  global_frame: map #在局部代价地图中的全局坐标系，一般需要设置为odom_frame，原为map，修改为odom
  robot_base_frame: base_footprint # 机器人本体的基坐标系
  update_frequency: 8.0 #局部代价地图更新频率
  publish_frequency: 1.0 #发布频率
  # 以上不用修改
  # static_map: false #delete warning by zyc
  rolling_window: true #设定为当前局部地图的中心位置
  # width和height可以微调
  width: 2.5 #代价地图的尺寸
  height: 2.5 #代价地图的尺寸
  # 以下两行不用修改
  resolution: 0.05 #代价地图（滚动窗口）的分辨率，一般和地图设置一致
  transform_tolerance: 1.0 #局部代价地图中的坐标系之间转换的最大可忍受延时

  cost_scaling_factor: 6 #为局部路径规划器服务
  inflation_radius: 0.15  #为局部路径规划器服务

  plugins: #改过了
   - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
   - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}

