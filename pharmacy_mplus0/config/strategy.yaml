# 比赛策略和超时参数集中配置。
# 这里的值优先服务“可调试性”：现场只改 YAML，不改 Python 代码。
dwell:
  # 到达体检窗口后明显停留的时间。
  exam_seconds: 1.5
  # 到达化验窗口后明显停留的时间。
  lab_seconds: 1.5
  # 到识别板一后等待画面稳定，再开始取识别结果。
  board1_settle_seconds: 1.0

timeouts:
  # 单次等待识别板一二维码结果的最长时间。
  board1_wait_seconds: 15.0
  # 识别板一失败后的最大重试次数。
  board1_max_retry: 3
  # 等待识别板二状态的最长时间；超时后主控按空闲处理，避免卡死。
  board2_wait_seconds: 10.0
  # 单段导航默认超时时间。
  nav_default_seconds: 40.0
  # 连续失败轮数过多时，后续主控可以原地停车等待人工检查。
  max_consecutive_fail_rounds: 5

visit_order:
  # 固定最短访问顺序表。
  # 注意 AC 和 ABC 不是字母顺序，而是按当前场地经验优化后的顺序。
  A: [A]
  B: [B]
  C: [C]
  AB: [A, B]
  AC: [C, A]
  BC: [C, B]
  ABC: [C, A, B]

task_priority:
  # true 表示优先选样本数最多的二维码，争取一次性配送加成。
  prefer_more_samples: true

rounds:
  # Codex.md 要求本次重构每轮结束回起点，为双车方案预留节奏。
  round_return_to_start: true

# 双车循环协作配置（默认关闭，不影响单车模式）。
dual_car_enabled: false
# 比赛开始时默认允许先出发的车号。
dual_car_start_first_car_id: "1"
# 完成配送后是否发布允许对车出发信号。
dual_car_publish_allow_when_returning: true

# 远程任务共享：启用后车 1 可将识别板一剩余二维码分配给车 2，车 2 可跳过识别板一。
# 注意：已移除时间戳过期限制，远程任务不再因 stamp 过旧而被丢弃。
# 任务有效性仅由字段完整性和合法性判断。
dual_car_remote_task_enabled: false

# 双车通信固定使用 TCP（独立 ROS Master），不再支持 ros_topic 跨车通信。
# 双车 TCP 通信总开关，配合 dual_car_enabled 使用。
dual_car_tcp_enabled: true
# 对车 IP 地址。此值必须通过命令行传入，无法在此设置通用默认值！
#   车 1 启动时: dual_car_peer_ip:=<车2的IP>
#   车 2 启动时: dual_car_peer_ip:=<车1的IP>
# 留空将导致 TCP bridge 不启动，双车无法通信！
dual_car_peer_ip: ""
# 本车 TCP 监听地址，0.0.0.0 表示监听所有网卡。
dual_car_listen_ip: "0.0.0.0"
# 本车监听端口。
dual_car_listen_port: 9001
# 对车监听端口。
dual_car_peer_port: 9001
# TCP 连接超时（秒）。
dual_car_tcp_connect_timeout_sec: 1.0
# TCP 断线重连间隔（秒）。
dual_car_tcp_reconnect_sec: 2.0
