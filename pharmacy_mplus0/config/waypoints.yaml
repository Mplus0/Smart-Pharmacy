# 所有坐标集中放在这里，主控和导航模块只引用逻辑名称。
# 后续现场实测坐标时，只需要改本文件，不要把坐标写进 Python 状态机。
frames:
  # move_base 使用的全局地图坐标系。
  map: map
  # 小车底盘坐标系，用于 TF 查询和位置上报。
  robot: base_footprint

waypoints:
  # 体检区 A/B/C。二维码字母决定需要访问哪些体检窗口。
  exam_A: {x: 0.685, y: 2.516, yaw: 1.5708}
  exam_B: {x: 1.463, y: 2.980, yaw: 1.5708}
  exam_C: {x: 1.530, y: 1.985, yaw: 1.5708}

  # 化验区 1-4。识别板一的方框索引会映射到这些窗口。
  lab_1: {x: -1.639, y: 2.471, yaw: -1.5708}
  lab_2: {x: -0.846, y: 1.771, yaw: -1.5708}
  lab_3: {x: -1.669, y: 1.238, yaw: -1.5708}
  lab_4: {x: -0.885, y: 0.780, yaw: -1.5708}

  # 起点和两块识别板位置。
  start: {x: 0.0, y: 0.0, yaw: 0.0}
  board1: {x: 0.861, y: 0.0, yaw: 0.0}
  board2: {x: -0.147, y: 3.813, yaw: 3.1416}

# 业务名称到航点名称的映射。
# 主控拿到体检窗口 A 后，会通过这里找到 exam_A。
exam_waypoints:
  A: exam_A
  B: exam_B
  C: exam_C

# 化验窗口编号到航点名称的映射。
lab_waypoints:
  "1": lab_1
  "2": lab_2
  "3": lab_3
  "4": lab_4
