# 视觉参数集中配置。
# 第一阶段只是草案，后续 board1_detector.py / board2_detector.py 会读取这些值。
camera:
  # web_video_server 提供的图像流地址。
  stream_url: "http://192.168.124.3:8080/stream?topic=/camera/rgb/image_raw"

board1:
  # ================================================================
  # 新方案参数（直接 pyzbar 整帧解码，不依赖 Canny/轮廓/透视）
  # ================================================================
  # 画面旋转校正角度（摄像头安装倾斜时调整）。
  rotate_degrees: 0
  # 连续稳定帧数，用于解码器内部稳定性过滤和 ROS 节点锁定。
  stable_frames: 3
  # pyzbar 扫描符号类型，通常只扫 QR 码即可。
  # 可选值: QRCODE, CODE128, CODE39, EAN13, EAN8 等。
  pyzbar_symbols: ["QRCODE"]

  # ================================================================
  # 以下为旧方案（Canny/轮廓/定位框/透视矫正）参数，已弃用，保留供参考。
  # ================================================================
  canny_low: 50
  canny_high: 150
  canny_aperture: 3
  contour_min_area: 500
  contour_max_area: 20000
  approx_poly_epsilon: 0.02
  square_wh_rate: 0.4
  center_distance_threshold: 20
  locating_box_count: 48
  min_outer_boxes: 8
  warp_width: 600
  warp_height: 600
  binary_threshold: 127
  crop_regions:
    box_1: {y1: 65, y2: 255, x1: 65, x2: 235}
    box_2: {y1: 65, y2: 255, x1: 365, x2: 535}
    box_3: {y1: 335, y2: 525, x1: 65, x2: 235}
    box_4: {y1: 335, y2: 525, x1: 365, x2: 535}

board2:
  # 模板图片目录，文件名约定为 idle.png / wait5.png ... wait10.png。
  template_dir: "$(find pharmacy_mplus0)/templates/board2"
  # 模板匹配阈值。
  match_threshold: 0.72
  # 连续多帧一致后才发布最终结果。
  debounce_frames: 3
  # 识别板二结果发布频率。
  publish_hz: 5.0
  # 多尺度模板匹配的缩放比例列表。
  scales: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2]
