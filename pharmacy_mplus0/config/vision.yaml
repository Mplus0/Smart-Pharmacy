# 视觉参数集中配置。
# 第一阶段只是草案，后续 board1_detector.py / board2_detector.py 会读取这些值。
camera:
  # web_video_server 提供的图像流地址。
  stream_url: "http://192.168.12.1:8080/stream?topic=/camera/rgb/image_raw"

board1:
  # 识别板一旧策略中对画面做了约 5 度旋转校正。
  rotate_degrees: 5.0
  # Canny 边缘检测参数。
  canny_low: 50
  canny_high: 150
  canny_aperture: 3
  # 定位框轮廓面积范围，用于过滤噪声和过大区域。
  contour_min_area: 500
  contour_max_area: 20000
  # 四边形近似参数，越小越贴合原轮廓。
  approx_poly_epsilon: 0.02
  # 近似正方形筛选阈值，越小越接近正方形。
  square_wh_rate: 0.4
  # 嵌套定位框中心距离阈值。
  center_distance_threshold: 20
  # 旧算法在识别完整板面时，定位框数量满足 48 后开始透视矫正。
  locating_box_count: 48
  # 透视矫正后的固定画布尺寸。
  warp_width: 600
  warp_height: 600
  # 裁剪二维码区域后用于二值化的阈值。
  binary_threshold: 127
  # 四个二维码区域在矫正画布中的裁剪范围。
  crop_regions:
    box_1: {y1: 65, y2: 255, x1: 65, x2: 235}
    box_2: {y1: 65, y2: 255, x1: 365, x2: 535}
    box_3: {y1: 335, y2: 525, x1: 65, x2: 235}
    box_4: {y1: 335, y2: 525, x1: 365, x2: 535}
  # 连续稳定帧数，后续识别节点用来锁定结果，减少抖动。
  stable_frames: 3

board2:
  # 模板图片目录，文件名约定为 idle.png / wait5.png ... wait10.png。
  template_dir: "$(find pharmacy_mplus0)/templates/board2"
  # 模板匹配阈值。
  match_threshold: 0.72
  # 连续多帧一致后才发布最终结果。
  debounce_frames: 3
  # 识别板二结果发布频率。
  publish_hz: 5.0
  # 多尺度模板匹配的缩放比例列表。
  scales: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2]
